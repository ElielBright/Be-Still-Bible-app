<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="400" height="800" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="180" fill="rgba(255,255,255,0.03)"/>
  <circle cx="200" cy="600" r="200" fill="rgba(255,255,255,0.02)"/>
  <!-- Cross -->
  <g transform="translate(200,240)">
    <rect x="-16" y="-72" width="32" height="144" rx="5" fill="url(#cross-grad)"/>
    <rect x="-48" y="-29" width="96" height="29" rx="5" fill="url(#cross-grad)"/>
  </g>
  <!-- App name -->
  <text x="200" y="370" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">Edify</text>
  <text x="200" y="400" font-family="Georgia, serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle">Bible Study Companion</text>
  <!-- Verse -->
  <text x="200" y="480" font-family="Georgia, serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-style="italic">"I can do all things through Christ</text>
  <text x="200" y="504" font-family="Georgia, serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-style="italic">who strengthens me."</text>
  <text x="200" y="528" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle">— Philippians 4:13</text>
  <!-- Loading dots -->
  <g transform="translate(200,600)">
    <circle cx="-20" cy="0" r="6" fill="rgba(255,255,255,0.4)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="rgba(255,255,255,0.4)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="20" cy="0" r="6" fill="rgba(255,255,255,0.4)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>
</svg>

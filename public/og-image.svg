<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(255,255,255,0.03)"/>
  <!-- Cross -->
  <g transform="translate(200,315)">
    <rect x="-20" y="-90" width="40" height="180" rx="6" fill="url(#cross-grad)"/>
    <rect x="-60" y="-36" width="120" height="36" rx="6" fill="url(#cross-grad)"/>
  </g>
  <!-- Text -->
  <text x="340" y="260" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white">Edify</text>
  <text x="340" y="310" font-family="Georgia, serif" font-size="28" fill="rgba(255,255,255,0.7)">Bible Study Companion</text>
  <text x="340" y="370" font-family="sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" max-width="600">Scripture. Sermons. Insight. All in one place.</text>
  <!-- Bottom bar -->
  <rect x="340" y="420" width="520" height="4" rx="2" fill="rgba(129,140,248,0.5)"/>
</svg>
